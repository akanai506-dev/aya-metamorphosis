<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>勉強アプリ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B5CF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --main: #8B5CF6;
  --main-light: #A78BFA;
  --main-dark: #7C3AED;
  --accent: #C084FC;
  --accent-warm: #E879F9;
  --accent-soft: #DDD6FE;
  --white: #FFFFFF;
  --bg: #e2c6ff;
  --text: #3B1F6E;
  --text-light: #7C6BA0;
  --card-radius: 24px;
  --card-shadow: 0 8px 32px rgba(139, 92, 246, 0.18);
  --nav-height: 72px;
}

html, body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding-bottom: calc(var(--nav-height) + 16px);
}

/* Pages */
.page { display: none; padding: 16px 16px 24px; max-width: 480px; margin: 0 auto; }
.page.active { display: block; }

/* Header */
.page-header {
  text-align: center;
  padding: 16px 0 8px;
}
.page-header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--main);
}

/* Cards */
.card {
  background: var(--white);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: 24px;
  margin-bottom: 16px;
}

/* Character */
.character-area {
  text-align: center;
  padding: 24px 0 8px;
  position: relative;
}
.character-img {
  width: 160px;
  height: auto;
  animation: float 3s ease-in-out infinite;
  display: inline-block;
  object-fit: contain;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.character-msg {
  margin-top: 8px;
  font-size: 1rem;
  font-weight: 500;
  color: var(--main);
  min-height: 1.5em;
}

/* Streak */
.streak-area {
  text-align: center;
  margin-bottom: 12px;
}
.streak-count {
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--main-dark);
  line-height: 1;
}
.streak-label {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-top: 2px;
}

/* Daily log */
.daily-log textarea {
  width: 100%;
  min-height: 80px;
  border: 2px solid #D4BFFA;
  border-radius: 16px;
  padding: 14px;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  background: #F5F0FF;
}
.daily-log textarea:focus {
  border-color: var(--main);
}
.daily-log textarea::placeholder {
  color: #B0A0C8;
}
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--main), var(--accent));
  color: var(--white);
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 12px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:active {
  transform: scale(0.97);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: default;
}
.log-saved-msg {
  text-align: center;
  color: var(--main);
  font-weight: 500;
  font-size: 0.9rem;
  margin-top: 8px;
  min-height: 1.4em;
}

/* Week Tabs */
.week-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-tabs::-webkit-scrollbar { display: none; }
.week-tab {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 20px;
  border: 2px solid #D4BFFA;
  background: var(--white);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.week-tab.active {
  background: var(--main);
  color: var(--white);
  border-color: var(--main);
}

/* Week Info */
.week-info {
  margin: 12px 0;
}
.week-theme {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--main-dark);
}

/* Progress Bar */
.progress-bar-wrap {
  background: #E0D4F5;
  border-radius: 10px;
  height: 10px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--main), var(--accent-warm));
  border-radius: 10px;
  transition: width 0.4s ease;
}
.progress-text {
  font-size: 0.8rem;
  color: var(--text-light);
  text-align: right;
  margin-bottom: 4px;
}

/* Task List */
.task-list {
  list-style: none;
}
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #EDE5F7;
}
.task-item:last-child { border-bottom: none; }
.task-check {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 2px solid #D4BFFA;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 1px;
  background: var(--white);
}
.task-check.checked {
  background: var(--main);
  border-color: var(--main);
}
.task-check.checked::after {
  content: '✓';
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
}
.task-text {
  font-size: 0.9rem;
  line-height: 1.5;
  flex: 1;
}
.task-text.completed {
  text-decoration: line-through;
  opacity: 0.5;
}

/* Add Task */
.add-task-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.add-task-row input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid #D4BFFA;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  background: #F5F0FF;
}
.add-task-row input:focus { border-color: var(--main); }
.btn-add {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: var(--main);
  color: var(--white);
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Log History */
.log-entry {
  padding: 16px 0;
  border-bottom: 1px solid #EDE5F7;
}
.log-entry:last-child { border-bottom: none; }
.log-date {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--main);
  margin-bottom: 4px;
}
.log-text {
  font-size: 0.9rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.empty-state {
  text-align: center;
  color: var(--text-light);
  padding: 32px 0;
  font-size: 0.9rem;
}

/* Settings */
.setting-item {
  padding: 16px 0;
  border-bottom: 1px solid #EDE5F7;
}
.setting-item:last-child { border-bottom: none; }
.setting-label {
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 8px;
}
.btn-danger {
  padding: 12px 24px;
  background: #FF4444;
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
}

/* Quote */
.quote-card {
  background: linear-gradient(135deg, #EDE5F7, #F3E8FF);
  border-radius: var(--card-radius);
  padding: 24px;
  margin-bottom: 16px;
  text-align: center;
  position: relative;
}
.quote-icon {
  margin-bottom: 8px;
  display: flex;
  justify-content: center;
}
.quote-text {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.7;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: var(--white);
  border-top: 1px solid #E0D4F5;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 8px 12px;
  border: none;
  background: none;
  font-family: inherit;
  color: var(--text-light);
  transition: color 0.2s;
}
.nav-item.active {
  color: var(--main);
}
.nav-icon {
  width: 24px;
  height: 24px;
  display: block;
}
.nav-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-label {
  font-size: 0.65rem;
  font-weight: 700;
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--main);
  color: var(--white);
  padding: 12px 24px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 200;
  transition: transform 0.3s ease;
  box-shadow: 0 4px 16px rgba(139,92,246,0.3);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 28px;
  max-width: 320px;
  width: 100%;
  text-align: center;
}
.modal h3 {
  font-size: 1.1rem;
  margin-bottom: 8px;
  color: var(--main-dark);
}
.modal p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 20px;
  line-height: 1.5;
}
.modal-btns {
  display: flex;
  gap: 10px;
}
.modal-btns button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
}
.btn-cancel {
  background: #E8E0F0;
  color: var(--text-light);
}
.btn-confirm {
  background: #FF4444;
  color: var(--white);
}

/* Animations */
@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  70% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}
.card { animation: pop 0.3s ease; }
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">やめる</button>
      <button class="btn-confirm" id="modal-confirm">リセット</button>
    </div>
  </div>
</div>

<!-- ===== HOME ===== -->
<div id="page-home" class="page active">

  </div>

    <div class="quote-text" id="quote-text"></div>
  </div>
</div>

<!-- ===== TASKS ===== -->
<div id="page-tasks" class="page">

</div>

<!-- ===== LOGS ===== -->
<div id="page-logs" class="page">
  <div class="page-header">
    <h1>ログ履歴</h1>
  </div>
  <div class="card" id="log-history"></div>
</div>

<!-- ===== SETTINGS ===== -->
<div id="page-settings" class="page">
  <div class="page-header">
    <h1>設定</h1>
  </div>

  <div class="quote-card">
    <div class="quote-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--main)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-6-4-10-10-10 6 0 10-4 10-10 0 6 4 10 10 10-6 0-10 4-10 10z"/></svg></div>
    <div class="quote-text" id="settings-quote"></div>
  </div>

  <div class="card">
    <div class="setting-item">
      <div class="setting-label">すべてのデータをリセット</div>
      <button class="btn-danger" onclick="confirmReset()">データリセット</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg></span>

</nav>

    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function save(key, val) {
  localStorage.setItem('metamorphose_' + key, JSON.stringify(val));
}

// ============================================================
// State
// ============================================================
let tasks = load('tasks', null);
if (!tasks) { tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS)); save('tasks', tasks); }
let logs = load('logs', []);
let streak = load('streak', { count: 0, lastDate: null });
let currentWeek = 1;
let nextTaskId = load('nextTaskId', 20);

// ============================================================
// Navigation
// ============================================================
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  if (page === 'home') renderHome();
  if (page === 'tasks') renderTasks();
  if (page === 'logs') renderLogs();
  if (page === 'settings') renderSettings();
}

// ============================================================
// Home
// ============================================================
function getCharacterStage() {
  if (streak.count >= 22) return 'butterfly';
  if (streak.count >= 8) return 'chrysalis';
  return 'caterpillar';
}

function renderHome() {
  const stage = getCharacterStage();
  const data = CHARACTER_DATA[stage];
  document.getElementById('character').src = data.img;
  document.getElementById('character-msg').textContent = data.messages[Math.floor(Math.random() * data.messages.length)];
  document.getElementById('streak-count').textContent = streak.count;
  document.getElementById('quote-text').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  // Restore today's log if exists
  const today = getToday();
  const todayLog = logs.find(l => l.date === today);
  const textarea = document.getElementById('log-input');
  const savedMsg = document.getElementById('log-saved-msg');
  if (todayLog) {
    textarea.value = todayLog.text;
    savedMsg.textContent = '今日はもう記録済みです';
  } else {
    textarea.value = '';
    savedMsg.textContent = '';
  }
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function saveLog() {
  const text = document.getElementById('log-input').value.trim();
  if (!text) return;

  const today = getToday();
  const existing = logs.findIndex(l => l.date === today);
  if (existing >= 0) {
    logs[existing].text = text;
  } else {
    logs.push({ date: today, text });
  }
  save('logs', logs);

  // Update streak
  if (streak.lastDate !== today) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
    if (streak.lastDate === yStr) {
      streak.count++;
    } else if (streak.lastDate !== today) {
      streak.count = 1;
    }
    streak.lastDate = today;
    save('streak', streak);
  }

  document.getElementById('streak-count').textContent = streak.count;
  document.getElementById('log-saved-msg').textContent = '記録しました！';

  // Re-render character in case of evolution
  const stage = getCharacterStage();
  const data = CHARACTER_DATA[stage];
  document.getElementById('character').src = data.img;
  document.getElementById('character-msg').textContent = data.messages[Math.floor(Math.random() * data.messages.length)];

  showToast('記録しました！');
}

// ============================================================
// Tasks
// ============================================================
function renderTasks() {
  // Week tabs
  const tabsEl = document.getElementById('week-tabs');
  tabsEl.innerHTML = '';
  for (let w = 1; w <= 8; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (w === currentWeek ? ' active' : '');
    btn.textContent = 'Week ' + w;
    btn.onclick = () => { currentWeek = w; renderTasks(); };
    tabsEl.appendChild(btn);
  }

  // Theme
  document.getElementById('week-theme').textContent = WEEK_THEMES[currentWeek];

  // Tasks for this week
  const weekTasks = tasks.filter(t => t.week === currentWeek);
  const completed = weekTasks.filter(t => t.completed).length;
  const total = weekTasks.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('progress-text').textContent = `${completed} / ${total} 完了 (${pct}%)`;
  document.getElementById('progress-bar').style.width = pct + '%';

  const listEl = document.getElementById('task-list');
  listEl.innerHTML = '';
  weekTasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item';
    li.innerHTML = `
      <div class="task-check ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
      <span class="task-text ${task.completed ? 'completed' : ''}">${escHtml(task.text)}</span>
    `;
    listEl.appendChild(li);
  });
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.completed = !task.completed;
    save('tasks', tasks);
    renderTasks();
  }
}

function addTask() {
  const input = document.getElementById('new-task-input');
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ id: nextTaskId++, week: currentWeek, text, completed: false });
  save('tasks', tasks);
  save('nextTaskId', nextTaskId);
  input.value = '';
  renderTasks();
  showToast('タスクを追加しました');
}

document.getElementById('new-task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// ============================================================
// Logs
// ============================================================
function renderLogs() {
  const el = document.getElementById('log-history');
  if (logs.length === 0) {
    el.innerHTML = '<div class="empty-state">まだログがありません</div>';
    return;
  }
  const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(log => {
    const d = new Date(log.date + 'T00:00:00');
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const dateStr = `${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;
    return `<div class="log-entry"><div class="log-date">${dateStr}</div><div class="log-text">${escHtml(log.text)}</div></div>`;
  }).join('');
}

// ============================================================
// Settings
// ============================================================
function renderSettings() {
  document.getElementById('settings-quote').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
}

function confirmReset() {
  document.getElementById('modal-title').textContent = 'データリセット';
  document.getElementById('modal-msg').textContent = 'すべてのデータ（ログ・タスク・ストリーク）が削除されます。この操作は元に戻せません。';
  document.getElementById('modal-confirm').onclick = doReset;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function doReset() {
  localStorage.removeItem('metamorphose_tasks');
  localStorage.removeItem('metamorphose_logs');
  localStorage.removeItem('metamorphose_streak');
  localStorage.removeItem('metamorphose_nextTaskId');
  tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
  logs = [];
  streak = { count: 0, lastDate: null };
  nextTaskId = 20;
  save('tasks', tasks);
  save('nextTaskId', nextTaskId);
  closeModal();
  navigateTo('home');
  showToast('リセットしました');
}

// ============================================================
// Utils
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// Init
// ============================================================
renderHome();
</script>
</body>
</html>
