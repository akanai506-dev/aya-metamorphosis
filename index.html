<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>フミダス</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8B5CF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --main: #8B5CF6;
  --main-light: #A78BFA;
  --main-dark: #7C3AED;
  --accent: #C084FC;
  --accent-warm: #E879F9;
  --accent-soft: #DDD6FE;
  --white: #FFFFFF;
  --bg: #e2c6ff;
  --text: #3B1F6E;
  --text-light: #7C6BA0;
  --card-radius: 24px;
  --card-shadow: 0 8px 32px rgba(139, 92, 246, 0.18);
  --nav-height: 72px;
}

html, body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding-bottom: calc(var(--nav-height) + 16px);
}

/* Pages */
.page { display: none; padding: 16px 16px 24px; max-width: 480px; margin: 0 auto; }
.page.active { display: block; }

/* Header */
.page-header {
  text-align: center;
  padding: 16px 0 8px;
}
.page-header h1 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--main);
}

/* Cards */
.card {
  background: var(--white);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: 24px;
  margin-bottom: 16px;
}

/* Login Page */
.login-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 24px;
  text-align: center;
}
.login-page .login-card {
  background: var(--white);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  padding: 40px 32px;
  max-width: 360px;
  width: 100%;
}
.login-title {
  font-size: 2rem;
  font-weight: 900;
  color: var(--main);
  margin-bottom: 4px;
}
.login-subtitle {
  font-size: 0.9rem;
  color: var(--text-light);
  margin-bottom: 32px;
}
.login-character {
  width: 120px;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
}
.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  background: var(--white);
  border: 2px solid #D4BFFA;
  border-radius: 16px;
  font-family: inherit;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
}
.btn-google:hover { border-color: var(--main); background: #F5F0FF; }
.btn-google:active { transform: scale(0.97); }
.btn-google svg { flex-shrink: 0; }
.login-loading {
  display: none;
  text-align: center;
  padding: 20px;
  color: var(--main);
  font-weight: 500;
}
.login-loading.show { display: block; }

/* Character */
.character-area {
  text-align: center;
  padding: 24px 0 8px;
  position: relative;
}
.character-img {
  width: 160px;
  height: auto;
  animation: float 3s ease-in-out infinite;
  display: inline-block;
  object-fit: contain;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.character-msg {
  margin-top: 8px;
  font-size: 1rem;
  font-weight: 500;
  color: var(--main);
  min-height: 1.5em;
}

/* Streak */
.streak-area {
  text-align: center;
  margin-bottom: 12px;
}
.streak-count {
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--main-dark);
  line-height: 1;
}
.streak-label {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-top: 2px;
}

/* Daily log */
.daily-log textarea {
  width: 100%;
  min-height: 80px;
  border: 2px solid #D4BFFA;
  border-radius: 16px;
  padding: 14px;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  background: #F5F0FF;
}
.daily-log textarea:focus {
  border-color: var(--main);
}
.daily-log textarea::placeholder {
  color: #B0A0C8;
}
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, var(--main), var(--accent));
  color: var(--white);
  border: none;
  border-radius: 16px;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 12px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-primary:active {
  transform: scale(0.97);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: default;
}
.log-saved-msg {
  text-align: center;
  color: var(--main);
  font-weight: 500;
  font-size: 0.9rem;
  margin-top: 8px;
  min-height: 1.4em;
}

/* Week Tabs */
.week-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.week-tabs::-webkit-scrollbar { display: none; }
.week-tab {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 20px;
  border: 2px solid #D4BFFA;
  background: var(--white);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.week-tab.active {
  background: var(--main);
  color: var(--white);
  border-color: var(--main);
}

/* Week Info */
.week-info {
  margin: 12px 0;
}
.week-theme {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--main-dark);
}

/* Progress Bar */
.progress-bar-wrap {
  background: #E0D4F5;
  border-radius: 10px;
  height: 10px;
  margin: 12px 0;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--main), var(--accent-warm));
  border-radius: 10px;
  transition: width 0.4s ease;
}
.progress-text {
  font-size: 0.8rem;
  color: var(--text-light);
  text-align: right;
  margin-bottom: 4px;
}

/* Task List */
.task-list {
  list-style: none;
}
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #EDE5F7;
}
.task-item:last-child { border-bottom: none; }
.task-check {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 2px solid #D4BFFA;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 1px;
  background: var(--white);
}
.task-check.checked {
  background: var(--main);
  border-color: var(--main);
}
.task-check.checked::after {
  content: '✓';
  color: var(--white);
  font-size: 14px;
  font-weight: 700;
}
.task-text {
  font-size: 0.9rem;
  line-height: 1.5;
  flex: 1;
}
.task-text.completed {
  text-decoration: line-through;
  opacity: 0.5;
}

/* Add Task */
.add-task-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.add-task-row input {
  flex: 1;
  padding: 10px 14px;
  border: 2px solid #D4BFFA;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  outline: none;
  background: #F5F0FF;
}
.add-task-row input:focus { border-color: var(--main); }
.btn-add {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: var(--main);
  color: var(--white);
  font-size: 1.4rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Log History */
.log-entry {
  padding: 16px 0;
  border-bottom: 1px solid #EDE5F7;
}
.log-entry:last-child { border-bottom: none; }
.log-date {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--main);
  margin-bottom: 4px;
}
.log-text {
  font-size: 0.9rem;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}
.empty-state {
  text-align: center;
  color: var(--text-light);
  padding: 32px 0;
  font-size: 0.9rem;
}

/* Settings */
.setting-item {
  padding: 16px 0;
  border-bottom: 1px solid #EDE5F7;
}
.setting-item:last-child { border-bottom: none; }
.setting-label {
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 8px;
}
.setting-value {
  font-size: 0.8rem;
  color: var(--text-light);
  margin-bottom: 8px;
}
.btn-danger {
  padding: 12px 24px;
  background: #FF4444;
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
}
.btn-logout {
  padding: 12px 24px;
  background: #E8E0F0;
  color: var(--text-light);
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
}

/* Quote */
.quote-card {
  background: linear-gradient(135deg, #EDE5F7, #F3E8FF);
  border-radius: var(--card-radius);
  padding: 24px;
  margin-bottom: 16px;
  text-align: center;
  position: relative;
}
.quote-icon {
  margin-bottom: 8px;
  display: flex;
  justify-content: center;
}
.quote-text {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.7;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: var(--white);
  border-top: 1px solid #E0D4F5;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding-bottom: env(safe-area-inset-bottom, 0);
  z-index: 100;
  transition: transform 0.3s;
}
.bottom-nav.hidden { transform: translateY(100%); }
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 8px 12px;
  border: none;
  background: none;
  font-family: inherit;
  color: var(--text-light);
  transition: color 0.2s;
}
.nav-item.active {
  color: var(--main);
}
.nav-icon {
  width: 24px;
  height: 24px;
  display: block;
}
.nav-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nav-label {
  font-size: 0.65rem;
  font-weight: 700;
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--main);
  color: var(--white);
  padding: 12px 24px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 0.9rem;
  z-index: 200;
  transition: transform 0.3s ease;
  box-shadow: 0 4px 16px rgba(139,92,246,0.3);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--white);
  border-radius: var(--card-radius);
  padding: 28px;
  max-width: 320px;
  width: 100%;
  text-align: center;
}
.modal h3 {
  font-size: 1.1rem;
  margin-bottom: 8px;
  color: var(--main-dark);
}
.modal p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 20px;
  line-height: 1.5;
}
.modal-btns {
  display: flex;
  gap: 10px;
}
.modal-btns button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
}
.btn-cancel {
  background: #E8E0F0;
  color: var(--text-light);
}
.btn-confirm {
  background: #FF4444;
  color: var(--white);
}

/* Animations */
@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  70% { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}
.card { animation: pop 0.3s ease; }

/* AI Summary */
.summary-card {
  background: linear-gradient(135deg, #F3E8FF, #EDE5F7);
  border-radius: var(--card-radius);
  padding: 24px;
  margin-bottom: 16px;
}
.summary-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.summary-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--main-dark);
}
.btn-summarize {
  padding: 8px 18px;
  background: linear-gradient(135deg, var(--main), var(--accent));
  color: var(--white);
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
}
.btn-summarize:active { transform: scale(0.95); }
.btn-summarize:disabled { opacity: 0.5; cursor: default; }
.summary-content {
  font-size: 0.88rem;
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.summary-empty {
  font-size: 0.85rem;
  color: var(--text-light);
  text-align: center;
  padding: 8px 0;
}
.summary-loading {
  text-align: center;
  padding: 16px 0;
  color: var(--main);
  font-size: 0.85rem;
  font-weight: 500;
}
.summary-loading::after {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--main);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 8px;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-msg"></p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">やめる</button>
      <button class="btn-confirm" id="modal-confirm">リセット</button>
    </div>
  </div>
</div>

<!-- ===== LOGIN ===== -->
<div id="page-login" class="login-page active">
  <div class="login-card">
    <img class="login-character" src="caterpillar.png" alt="キャラクター">
    <div class="login-title">フミダス</div>
    <div class="login-subtitle">AI学習の習慣を、ここから。</div>
    <button class="btn-google" id="btn-google" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Googleでログイン
    </button>
    <div class="login-loading" id="login-loading">ログイン中...</div>
  </div>
</div>

<!-- ===== HOME ===== -->
<div id="page-home" class="page">
  <div class="page-header">
    <h1>フミダス</h1>
  </div>

  <div class="character-area">
    <img class="character-img" id="character" src="" alt="キャラクター">
    <div class="character-msg" id="character-msg"></div>
  </div>

  <div class="streak-area">
    <div class="streak-count" id="streak-count">0</div>
    <div class="streak-label">日連続</div>
  </div>

  <div class="card daily-log">
    <textarea id="log-input" placeholder="今日学んだことや気づきをひとこと書こう！"></textarea>
    <button class="btn-primary" id="log-btn" onclick="saveLog()">記録する</button>
    <div class="log-saved-msg" id="log-saved-msg"></div>
  </div>

  <div class="summary-card">
    <div class="summary-header">
      <span class="summary-title">今日の学びまとめ</span>
      <button class="btn-summarize" id="summarize-btn" onclick="summarizeLogs()">AIで要約</button>
    </div>
    <div id="summary-area">
      <div class="summary-empty">記録した内容をAIが箇条書きで要約します</div>
    </div>
  </div>

  <div class="quote-card">
    <div class="quote-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--main)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-6-4-10-10-10 6 0 10-4 10-10 0 6 4 10 10 10-6 0-10 4-10 10z"/></svg></div>
    <div class="quote-text" id="quote-text"></div>
  </div>
</div>

<!-- ===== TASKS ===== -->
<div id="page-tasks" class="page">
  <div class="page-header">
    <h1>8週間ロードマップ</h1>
  </div>

  <div class="week-tabs" id="week-tabs"></div>

  <div class="card">
    <div class="week-info">
      <div class="week-theme" id="week-theme"></div>
    </div>
    <div class="progress-text" id="progress-text"></div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
    <ul class="task-list" id="task-list"></ul>
    <div class="add-task-row">
      <input type="text" id="new-task-input" placeholder="タスクを追加...">
      <button class="btn-add" onclick="addTask()">+</button>
    </div>
  </div>
</div>

<!-- ===== LOGS ===== -->
<div id="page-logs" class="page">
  <div class="page-header">
    <h1>ログ履歴</h1>
  </div>
  <div class="card" id="log-history"></div>
</div>

<!-- ===== SETTINGS ===== -->
<div id="page-settings" class="page">
  <div class="page-header">
    <h1>設定</h1>
  </div>

  <div class="quote-card">
    <div class="quote-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--main)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-6-4-10-10-10 6 0 10-4 10-10 0 6 4 10 10 10-6 0-10 4-10 10z"/></svg></div>
    <div class="quote-text" id="settings-quote"></div>
  </div>

  <div class="card">
    <div class="setting-item">
      <div class="setting-label">ログインアカウント</div>
      <div class="setting-value" id="user-email"></div>
    </div>
    <div class="setting-item">
      <div class="setting-label">すべてのデータをリセット</div>
      <button class="btn-danger" onclick="confirmReset()">データリセット</button>
    </div>
    <div class="setting-item">
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav hidden" id="bottom-nav">
  <button class="nav-item active" data-page="home">
    <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg></span>
    <span class="nav-label">ホーム</span>
  </button>
  <button class="nav-item" data-page="tasks">

<script>
// ============================================================
// Supabase Config — REPLACE THESE WITH YOUR VALUES
// ============================================================
const SUPABASE_URL = 'https://zcxvitqrtsbpuqbwdsue.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_f-NtmLsFaS_xZNNkgGZKJg_OfaTvsZK';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================================
// Data
// ============================================================
const WEEK_THEMES = {
  1: 'LLMの仕組み（Transformer・学習・推論）',
  2: 'LLMの仕組み（Transformer・学習・推論）',
  3: 'プロンプト設計（体系的な書き方・テクニック）',
  4: 'プロンプト設計（体系的な書き方・テクニック）',
  5: 'RAG・ベクトル検索の仕組み',
  6: 'RAG・ベクトル検索の仕組み',
  7: 'エージェント・MCP・ツール連携',
  8: 'エージェント・MCP・ツール連携',
};

const DEFAULT_TASKS = [
  { week: 1, text: '「次の単語予測」がなぜ高度な能力になるか理解する' },
  { week: 1, text: '単語→ベクトル変換（埋め込み）の仕組みを学ぶ' },
  { week: 1, text: '創発（Emergence）の概念を理解する' },
  { week: 1, text: '本を読む：『誰でもわかる大規模言語モデル入門』' },
  { week: 2, text: 'Transformerの仕組み（Attention）を学ぶ' },
  { week: 2, text: '事前学習とファインチューニングの違いを理解' },
  { week: 2, text: 'noteに「LLMの仕組み」記事を書く' },
  { week: 3, text: 'プロンプトの基本構造を学ぶ' },
  { week: 3, text: 'Few-shot / Zero-shot の違いを理解' },
  { week: 4, text: 'Chain of Thought プロンプトを実践' },
  { week: 4, text: '業務で使えるプロンプトテンプレート作成' },
  { week: 5, text: 'RAGの基本概念を学ぶ' },
  { week: 5, text: 'ベクトルデータベースの仕組みを理解' },
  { week: 6, text: '類似度検索の仕組みを学ぶ' },
  { week: 6, text: 'RAGのユースケースを整理' },
  { week: 7, text: 'AIエージェントの概念を理解' },
  { week: 7, text: 'MCP（Model Context Protocol）を学ぶ' },
  { week: 8, text: 'ツール連携の仕組みを理解' },
  { week: 8, text: '総まとめnote記事を書く' },
];

const QUOTES = [
  '変化の途中は、一番しんどい。でも、それが成長の証。',
  '完璧じゃなくていい。やり続けることが力になる。',
  'さなぎの中は暗い。でもその先に羽がある。',
  '小さな一歩の積み重ねが、大きな変化を生む。',
  '今日の自分は、昨日の自分より少しだけ強い。',
  '学ぶことは、未来の自分へのプレゼント。',
  '迷ったら、とりあえずやってみる。それが一番の近道。',
  '知らないことに出会えるのは、すごく贅沢なこと。',
  '続けた先に見える景色がある。',
  '理解できなくても大丈夫。何度でも戻ってこよう。',
];

const CHARACTER_DATA = {
  caterpillar: {
    img: 'caterpillar.png',
    messages: ['一緒にがんばろ〜♪', 'まずは一歩ずつ！', 'もぐもぐ知識を食べてるよ！', 'ゆっくりでいいんだよ〜'],
  },
  chrysalis: {
    img: 'chrysalis.png',
    messages: ['変わってる途中...', '静かに力を蓄えてる', 'もうすぐ何かが起こるよ...', '内側で大きく変化中！'],
  },
  butterfly: {
    img: 'butterfly.png',
    messages: ['羽ばたいてるね！✨', 'キラキラしてる！', '素敵な変化を遂げたね！', '空高く飛んでいこう！'],
  },
};

// ============================================================
// State
// ============================================================
let currentUser = null;
let tasks = [];
let logs = [];
let streak = { count: 0, last_date: null };
let currentWeek = 1;

// ============================================================
// Auth
// ============================================================
async function loginWithGoogle() {
  document.getElementById('login-loading').classList.add('show');
  document.getElementById('btn-google').style.display = 'none';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin },
  });
  if (error) {
    showToast('ログインに失敗しました');
    document.getElementById('login-loading').classList.remove('show');
    document.getElementById('btn-google').style.display = 'flex';
  }
}

async function logout() {
  await sb.auth.signOut();
  currentUser = null;
  showLoginPage();
}

function showLoginPage() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-login').classList.add('active');
  document.getElementById('page-login').style.display = 'flex';
  document.getElementById('bottom-nav').classList.add('hidden');
  document.body.style.paddingBottom = '0';
}

function showApp() {
  document.getElementById('page-login').style.display = 'none';
  document.getElementById('page-login').classList.remove('active');
  document.getElementById('bottom-nav').classList.remove('hidden');
  document.body.style.paddingBottom = 'calc(var(--nav-height) + 16px)';
  navigateTo('home');
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    currentUser = session.user;
    await loadAllData();
    showApp();
  } else {
    currentUser = null;
    showLoginPage();
  }
});

// ============================================================
// Data Loading
// ============================================================
async function loadAllData() {
  await Promise.all([loadTasks(), loadLogs(), loadStreak()]);
}

async function loadTasks() {
  const { data, error } = await sb.from('tasks').select('*').order('id');
  if (error) { console.error(error); return; }
  if (data.length === 0) {
    // First login: seed default tasks
    const inserts = DEFAULT_TASKS.map(t => ({ week: t.week, text: t.text, completed: false }));
    const { data: inserted, error: err } = await sb.from('tasks').insert(inserts).select();
    if (err) { console.error(err); return; }
    tasks = inserted;
  } else {
    tasks = data;
  }
}

async function loadLogs() {
  const { data, error } = await sb.from('logs').select('*').order('date', { ascending: false });
  if (error) { console.error(error); return; }
  logs = data;
}

async function loadStreak() {
  const { data, error } = await sb.from('streaks').select('*').single();
  if (error && error.code !== 'PGRST116') { console.error(error); return; }
  if (data) {
    streak = data;
  } else {
    // Create initial streak record
    const { data: created } = await sb.from('streaks').insert({ count: 0, last_date: null }).select().single();
    if (created) streak = created;
  }
}

// ============================================================
// Navigation
// ============================================================
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

function navigateTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  if (page === 'home') renderHome();
  if (page === 'tasks') renderTasks();
  if (page === 'logs') renderLogs();
  if (page === 'settings') renderSettings();
}

// ============================================================
// Home
// ============================================================
function getCharacterStage() {
  if (streak.count >= 22) return 'butterfly';
  if (streak.count >= 8) return 'chrysalis';
  return 'caterpillar';
}

async function renderHome() {
  const stage = getCharacterStage();
  const data = CHARACTER_DATA[stage];
  document.getElementById('character').src = data.img;
  document.getElementById('character-msg').textContent = data.messages[Math.floor(Math.random() * data.messages.length)];
  document.getElementById('streak-count').textContent = streak.count;
  document.getElementById('quote-text').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];

  // Restore today's log if exists
  const today = getToday();
  const todayLog = logs.find(l => l.date === today);
  const textarea = document.getElementById('log-input');
  const savedMsg = document.getElementById('log-saved-msg');
  if (todayLog) {
    textarea.value = todayLog.text;
    savedMsg.textContent = '今日はもう記録済みです';
  } else {
    textarea.value = '';
    savedMsg.textContent = '';
  }

  // Restore saved summary
  await renderSummary();
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function saveLog() {
  const text = document.getElementById('log-input').value.trim();
  if (!text) return;

  const today = getToday();

  // Upsert log
  const { data: logData, error } = await supabase
    .from('logs')
    .upsert({ date: today, text }, { onConflict: 'user_id,date' })
    .select()
    .single();

  if (error) { console.error(error); showToast('保存に失敗しました'); return; }

  // Update local logs
  const existingIdx = logs.findIndex(l => l.date === today);
  if (existingIdx >= 0) {
    logs[existingIdx] = logData;
  } else {
    logs.unshift(logData);
  }

  // Update streak
  if (streak.last_date !== today) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth() + 1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
    if (streak.last_date === yStr) {
      streak.count++;
    } else {
      streak.count = 1;
    }
    streak.last_date = today;

    await sb.from('streaks').upsert({
      user_id: currentUser.id,
      count: streak.count,
      last_date: streak.last_date,
      updated_at: new Date().toISOString(),
    });
  }

  document.getElementById('streak-count').textContent = streak.count;
  document.getElementById('log-saved-msg').textContent = '記録しました！';

  // Re-render character
  const stage = getCharacterStage();
  const charData = CHARACTER_DATA[stage];
  document.getElementById('character').src = charData.img;
  document.getElementById('character-msg').textContent = charData.messages[Math.floor(Math.random() * charData.messages.length)];

  showToast('記録しました！');
}

// ============================================================
// Tasks
// ============================================================
function renderTasks() {
  const tabsEl = document.getElementById('week-tabs');
  tabsEl.innerHTML = '';
  for (let w = 1; w <= 8; w++) {
    const btn = document.createElement('button');
    btn.className = 'week-tab' + (w === currentWeek ? ' active' : '');
    btn.textContent = 'Week ' + w;
    btn.onclick = () => { currentWeek = w; renderTasks(); };
    tabsEl.appendChild(btn);
  }

  document.getElementById('week-theme').textContent = WEEK_THEMES[currentWeek];

  const weekTasks = tasks.filter(t => t.week === currentWeek);
  const completed = weekTasks.filter(t => t.completed).length;
  const total = weekTasks.length;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  document.getElementById('progress-text').textContent = `${completed} / ${total} 完了 (${pct}%)`;
  document.getElementById('progress-bar').style.width = pct + '%';

  const listEl = document.getElementById('task-list');
  listEl.innerHTML = '';
  weekTasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item';
    li.innerHTML = `
      <div class="task-check ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
      <span class="task-text ${task.completed ? 'completed' : ''}">${escHtml(task.text)}</span>
    `;
    listEl.appendChild(li);
  });
}

async function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.completed = !task.completed;
  renderTasks();
  await sb.from('tasks').update({ completed: task.completed }).eq('id', id);
}

async function addTask() {
  const input = document.getElementById('new-task-input');
  const text = input.value.trim();
  if (!text) return;

  const { data, error } = await supabase
    .from('tasks')
    .insert({ week: currentWeek, text, completed: false })
    .select()
    .single();

  if (error) { console.error(error); return; }

  tasks.push(data);
  input.value = '';
  renderTasks();
  showToast('タスクを追加しました');
}

document.getElementById('new-task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// ============================================================
// Logs
// ============================================================
function renderLogs() {
  const el = document.getElementById('log-history');
  if (logs.length === 0) {
    el.innerHTML = '<div class="empty-state">まだログがありません</div>';
    return;
  }
  const sorted = [...logs].sort((a, b) => b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(log => {
    const d = new Date(log.date + 'T00:00:00');
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const dateStr = `${d.getMonth() + 1}月${d.getDate()}日（${days[d.getDay()]}）`;
    return `<div class="log-entry"><div class="log-date">${dateStr}</div><div class="log-text">${escHtml(log.text)}</div></div>`;
  }).join('');
}

// ============================================================
// Settings
// ============================================================
function renderSettings() {
  document.getElementById('settings-quote').textContent = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  document.getElementById('user-email').textContent = currentUser?.email || '';
}

function confirmReset() {
  document.getElementById('modal-title').textContent = 'データリセット';
  document.getElementById('modal-msg').textContent = 'すべてのデータ（ログ・タスク・ストリーク）が削除されます。この操作は元に戻せません。';
  document.getElementById('modal-confirm').onclick = doReset;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

async function doReset() {
  await Promise.all([
    sb.from('logs').delete().eq('user_id', currentUser.id),
    sb.from('tasks').delete().eq('user_id', currentUser.id),
    sb.from('summaries').delete().eq('user_id', currentUser.id),
    sb.from('streaks').update({ count: 0, last_date: null }).eq('user_id', currentUser.id),
  ]);

  // Re-seed default tasks
  const inserts = DEFAULT_TASKS.map(t => ({ week: t.week, text: t.text, completed: false }));
  const { data: inserted } = await sb.from('tasks').insert(inserts).select();
  tasks = inserted || [];
  logs = [];
  streak = { count: 0, last_date: null };

  closeModal();
  navigateTo('home');
  showToast('リセットしました');
}

// ============================================================
// Utils
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// AI Summary
// ============================================================
async function summarizeLogs() {
  const today = getToday();
  const todayLogs = logs.filter(l => l.date === today);
  if (todayLogs.length === 0) {
    showToast('今日のログがありません');
    return;
  }

  const btn = document.getElementById('summarize-btn');
  const area = document.getElementById('summary-area');
  btn.disabled = true;
  area.innerHTML = '<div class="summary-loading">要約を生成中</div>';

  try {
    const res = await fetch('/api/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ logs: todayLogs.map(l => ({ date: l.date, text: l.text })) }),
    });

    if (!res.ok) throw new Error('API error');

    const data = await res.json();
    area.innerHTML = '<div class="summary-content">' + escHtml(data.summary) + '</div>';

    // Save summary to DB
    await sb.from('summaries').upsert(
      { date: today, content: data.summary },
      { onConflict: 'user_id,date' }
    );
  } catch (err) {
    area.innerHTML = '<div class="summary-empty">要約の生成に失敗しました。もう一度お試しください。</div>';
    console.error(err);
  } finally {
    btn.disabled = false;
  }
}

async function renderSummary() {
  const today = getToday();
  const area = document.getElementById('summary-area');
  const { data } = await sb.from('summaries').select('content').eq('date', today).single();
  if (data?.content) {
    area.innerHTML = '<div class="summary-content">' + escHtml(data.content) + '</div>';
  } else {
    area.innerHTML = '<div class="summary-empty">記録した内容をAIが箇条書きで要約します</div>';
  }
}

// ============================================================
// Init — check existing session
// ============================================================
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await loadAllData();
    showApp();
  } else {
    showLoginPage();
  }
})();
</script>
